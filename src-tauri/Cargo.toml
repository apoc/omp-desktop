[package]
name = "omp-desktop"
version = "0.5.0"
edition = "2021"

[lib]
name = "omp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# 2.13: `check()` no longer sets SSL_CERT_FILE/SSL_CERT_DIR process-wide on
# Linux, which every omp child would have inherited.
tauri-plugin-updater = "2.13"
serde = { version = "1", features = ["derive"] }
# `raw_value`: the conversation tree skips message bodies it does not read.
serde_json = { version = "1", features = ["raw_value"] }
notify = "8"
gix = "0.87"
open = { version = "5", features = ["shellexecute-on-windows"] }
sha2 = "0.11"
# Read-only access to omp's own `agent.db` (model MRU for the picker, #11).
# `bundled` compiles SQLite in, so no system library is needed on any OS.
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
# Machine/user PATH for omp and git children (`child_path.rs`, #34). Already
# in the tree via reqwest → hyper-util.
windows-registry = "0.6"

# Folder "Open with" on Windows/Linux launches the executable with the path
# in argv; this forwards it to the already-running instance instead of
# starting a second app. macOS routes the same request through
# `RunEvent::Opened` and needs no plugin - see `src/external_open.rs`.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
