[package]
name = "omp-desktop"
version = "0.12.0"
edition = "2021"

[lib]
name = "omp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# 2.13: `check()` no longer sets SSL_CERT_FILE/SSL_CERT_DIR process-wide on
# Linux, which every omp child would have inherited.
tauri-plugin-updater = "2.13"
serde = { version = "1", features = ["derive"] }
# `raw_value`: the conversation tree skips message bodies it does not read.
serde_json = { version = "1", features = ["raw_value"] }
notify = "8"
gix = "0.87"
open = { version = "5", features = ["shellexecute-on-windows"] }
sha2 = "0.11"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# Read-only access to omp's own `agent.db` (model MRU for the picker, #11).
# `bundled` compiles SQLite in, so no system library is needed on any OS.
rusqlite = { version = "0.40", features = ["bundled"] }
# The terminal panel's pseudo-terminal (`src/terminal/`): a shell per tab.
portable-pty = "0.9"
# Terminal output travels as base64 in JSON event payloads. Already in the
# tree via tauri (same 0.22 line, so no new package).
base64 = "0.22"
# Agent-facing CDP endpoint (`browser/proxy/ws.rs`): the server side of the
# agent's plain `ws://` loopback connection, so `handshake` only - no TLS.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# The pairing QR code, rendered as an SVG string (`remote/qr.rs`).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Web Push delivery (`remote/push.rs`): blocking client on a worker thread. The
# same rustls (ring, no aws-lc) build tauri-plugin-updater already uses.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_JobObjects",
    # WTS session flags: the screen-lock probe (`remote/lock.rs`).
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }
# Machine/user PATH for omp and git children (`child_path.rs`, #34). Already
# in the tree via reqwest → hyper-util.
windows-registry = "0.6"

# Folder "Open with" on Windows/Linux launches the executable with the path
# in argv; this forwards it to the already-running instance instead of
# starting a second app. macOS routes the same request through
# `RunEvent::Opened` and needs no plugin - see `src/external_open.rs`.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# Screen-lock probe for push-only-while-locked (`remote/lock.rs`). All of
# these crates are already in the tree (macOS via tauri/wry, zbus via
# tauri-plugin-single-instance); only the feature set is chosen here.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGSession"] }

# Linux: logind's `LockedHint` over the system bus.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Decode screenshot pixels in real-Chromium annotate regression tests
# (`base64` comes from the normal dependencies).
[dev-dependencies]
png = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
